<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#10191c">
  <title>管理员小小俊</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 74% 28%, rgba(255, 166, 92, 0.2), transparent 34%),
        linear-gradient(145deg, #111c1f, #17272a 54%, #10171a);
      color: #fff4e7;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      text-align: center;
    }

    main {
      width: min(100%, 520px);
      padding: 40px 28px;
      border: 1px solid rgba(255, 244, 231, 0.18);
      background: rgba(10, 18, 21, 0.68);
      backdrop-filter: blur(16px);
    }

    .mark {
      width: 54px;
      height: 2px;
      margin: 0 auto 22px;
      background: linear-gradient(90deg, #64d4cd, #ffb45f, #ff7967);
    }

    h1 {
      margin: 0;
      font-family: "Noto Serif SC", "Songti SC", serif;
      font-size: clamp(1.8rem, 5vw, 2.7rem);
      font-weight: 600;
    }

    p {
      margin: 16px 0 0;
      color: #d4c7b9;
      line-height: 1.8;
    }

    a {
      display: inline-flex;
      margin-top: 24px;
      padding: 12px 18px;
      border: 1px solid #ff7967;
      color: #fff4e7;
      text-decoration: none;
    }

    .status {
      color: #ffb45f;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1 id="admin-title">管理员小小俊</h1>
    <p id="admin-message" class="status">正在确认这台设备的管理员身份...</p>
    <a id="admin-home" href="home.html" hidden>先返回首页</a>
  </main>

  <script>
    (function () {
      var ADMIN_TOKEN = "#xxj-admin-9c7e4a2f6b31";
      var title = document.getElementById("admin-title");
      var message = document.getElementById("admin-message");
      var homeLink = document.getElementById("admin-home");

      if (window.location.hash !== ADMIN_TOKEN) {
        title.textContent = "管理员入口无效";
        message.textContent = "这个地址不能开启管理员权限，请使用小小俊自己保存的管理员入口。";
        message.style.color = "#ff7967";
        homeLink.hidden = false;
        return;
      }

      localStorage.setItem("xxj_owner_activated", "1");
      localStorage.setItem("xxj_album_owner", "1");
      localStorage.setItem("xxj_itinerary_owner", "1");
      localStorage.setItem("xxj_reflections_owner", "1");

      message.textContent = "管理员身份已确认，正在进入首页...";
      window.setTimeout(function () {
        window.location.replace("home.html");
      }, 700);
    })();
  </script>
</body>
</html>
