<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小小俊 · 个人网站</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/entry.css">
</head>
<body class="entry-page">
  <main class="entry-scene" id="entry-scene">
    <div class="entry-backdrop" aria-hidden="true"></div>
    <video class="entry-video" autoplay muted loop playsinline preload="metadata" poster="images/entry-city.jpg" aria-hidden="true">
      <source src="videos/entry-cyberpunk.mp4" type="video/mp4">
    </video>
    <div class="entry-overlay" aria-hidden="true"></div>
    <div class="entry-rays" aria-hidden="true"></div>
    <div class="entry-dust" aria-hidden="true"></div>

    <div class="entry-title-block">
      <p class="entry-kicker">小小俊 · 个人网站</p>
      <h1 class="entry-title">日落之后，故事开始</h1>
      <p class="entry-tip">点击任意位置，进入我的世界</p>
    </div>
  </main>

  <script src="js/entry.js"></script>
</body>
</html>
